<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPED 官员生涯追踪系统</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../libs/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    
    <style>
        @font-face {
            font-family: "retro";
            src: url("../libs/fonts/Pixel-Miners.otf") format("opentype");
        }
        @font-face {
            font-family: "retro1";
            src: url("../libs/fonts/dpcomic.ttf") format("truetype");
        }
        
        body {
            font-family: 'retro1', sans-serif;
            cursor: URL("../assets/img/cursor/cursor.png"), auto !important;
            background: #f5f5f5;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        /* 头部样式 - 原始CPED风格 */
        .cped-header {
            background: #333;
            color: #fff;
            padding: 20px;
            border-bottom: 4px solid #000;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        
        .cped-header h1 {
            font-family: 'retro', sans-serif;
            font-size: 28px;
            margin: 0;
            text-shadow: 3px 3px 0 #000;
        }
        
        .cped-header .subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin-top: 8px;
        }
        
        /* 主容器 */
        .main-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: calc(100vh - 140px);
        }
        
        /* 左侧搜索面板 */
        .sidebar {
            background: #fff;
            border-right: 4px solid #333;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 4px 0 0 rgba(0,0,0,0.1);
        }
        
        .panel-title {
            font-family: 'retro', sans-serif;
            font-size: 14px;
            color: #333;
            margin-bottom: 15px;
            padding: 10px;
            background: #f5f5f5;
            border: 2px solid #333;
            box-shadow: 2px 2px 0 #333;
        }
        
        /* 搜索框 */
        .search-box {
            margin-bottom: 20px;
        }
        
        .pixel-input {
            width: 100%;
            padding: 12px;
            font-family: 'retro1', sans-serif;
            font-size: 16px;
            border: 2px solid #333;
            background: #fff;
            outline: none;
            transition: all 0.1s;
            border-radius: 0;
            box-shadow: 2px 2px 0 #333;
        }
        
        .pixel-input:focus {
            background: #f0f8ff;
            border-color: #3498db;
        }
        
        /* 按钮 - 蓝色主题 */
        .pixel-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-family: 'retro', sans-serif;
            font-size: 12px;
            background: #3498db;
            color: #fff;
            border: 2px solid #333;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
            box-shadow: 3px 3px 0 #333;
            border-radius: 0;
        }
        
        .pixel-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 #333;
            background: #2980b9;
        }
        
        .pixel-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 #333;
        }
        
        .pixel-btn.secondary {
            background: #95a5a6;
        }
        
        .pixel-btn.secondary:hover {
            background: #7f8c8d;
        }
        
        /* 官员列表 */
        .officials-list {
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #333;
            background: #fff;
            box-shadow: 3px 3px 0 #333;
        }
        
        .official-item {
            padding: 12px;
            border-bottom: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .official-item:hover {
            background: #3498db;
            color: #fff;
        }
        
        .official-item.active {
            background: #2c3e50;
            color: #fff;
        }
        
        .official-name {
            font-size: 18px;
            font-weight: bold;
            font-family: 'retro', sans-serif;
        }
        
        .official-info {
            font-size: 14px;
            opacity: 0.7;
        }
        
        /* 主内容区 */
        .content {
            padding: 20px;
            overflow-y: auto;
            background: #f5f5f5;
        }
        
        /* 卡片样式 */
        .cped-card {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #333;
            box-shadow: 4px 4px 0 #333;
            border-radius: 0;
        }
        
        .card-header-retro {
            background: #333;
            color: #fff;
            padding: 15px;
            margin: -20px -20px 20px -20px;
            font-family: 'retro', sans-serif;
            font-size: 16px;
            border-bottom: 2px solid #000;
        }
        
        /* 头像 */
        .avatar {
            width: 100px;
            height: 100px;
            background: #3498db;
            border: 4px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'retro', sans-serif;
            font-size: 36px;
            color: #fff;
            box-shadow: 3px 3px 0 #333;
            flex-shrink: 0;
        }
        
        /* 统计框 */
        .stat-box {
            background: #f5f5f5;
            border: 2px solid #333;
            padding: 10px;
            text-align: center;
            box-shadow: 2px 2px 0 #333;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #3498db;
            font-family: 'retro', sans-serif;
        }
        
        /* 马赛克网格 - 级别晋升图 */
        .mosaic-grid {
            display: grid;
            grid-template-columns: 100px repeat(auto-fill, minmax(40px, 1fr));
            gap: 2px;
            padding: 20px;
            background: #f5f5f5;
            border: 2px solid #333;
            overflow-x: auto;
            box-shadow: 3px 3px 0 #333;
        }
        
        .mosaic-label {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-size: 12px;
            font-weight: bold;
            color: #333;
            font-family: 'retro', sans-serif;
        }
        
        .mosaic-cell {
            aspect-ratio: 1;
            border: 1px solid #333;
            min-width: 35px;
            min-height: 35px;
            transition: all 0.2s;
        }
        
        .mosaic-cell.filled {
            background: #3498db;
        }
        
        .mosaic-cell.empty {
            background: #fff;
            opacity: 0.5;
        }
        
        .mosaic-cell:hover {
            transform: scale(1.2);
            z-index: 10;
            box-shadow: 0 0 0 3px #333;
            position: relative;
        }
        
        .mosaic-header {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            background: #2c3e50;
            border: 1px solid #333;
            min-width: 35px;
            min-height: 35px;
            font-family: 'retro', sans-serif;
        }
        
        /* 地图容器 */
        .map-container {
            height: 500px;
            border: 2px solid #333;
            background: #f5f5f5;
            box-shadow: 3px 3px 0 #333;
        }
        
        /* 时间线 */
        .timeline {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px;
            background: #f5f5f5;
            border: 2px solid #333;
            box-shadow: 3px 3px 0 #333;
        }
        
        .timeline-item {
            flex: 1;
            min-width: 280px;
            background: #fff;
            border: 2px solid #333;
            padding: 15px;
            position: relative;
            box-shadow: 2px 2px 0 #333;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            height: 4px;
            background: #3498db;
        }
        
        .timeline-date {
            font-family: 'retro', sans-serif;
            font-size: 12px;
            color: #3498db;
            margin-bottom: 8px;
        }
        
        .timeline-position {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        
        .timeline-location {
            font-size: 14px;
            color: #666;
        }
        
        .timeline-level-tag {
            display: inline-block;
            padding: 4px 8px;
            background: #3498db;
            color: #fff;
            font-size: 12px;
            margin-top: 8px;
            border: 1px solid #333;
            font-family: 'retro', sans-serif;
        }
        
        /* 图例 */
        .legend {
            display: flex;
            gap: 20px;
            padding: 15px;
            background: #fff;
            border: 2px solid #333;
            margin-top: 10px;
            flex-wrap: wrap;
            box-shadow: 2px 2px 0 #333;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border: 1px solid #333;
        }
        
        /* 加载提示 */
        .loading-box {
            text-align: center;
            padding: 40px;
            font-size: 18px;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        
        .empty-state h2 {
            font-family: 'retro', sans-serif;
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #ccc;
        }
        
        /* 网格布局 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        /* 响应式 */
        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 280px 1fr;
            }
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                border-right: none;
                border-bottom: 4px solid #333;
                max-height: 300px;
            }
            .cped-header h1 {
                font-size: 20px;
            }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f5f5f5;
            border-left: 2px solid #333;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #3498db;
            border: 2px solid #333;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #2980b9;
        }
        
        /* 导航按钮 */
        .nav-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #3498db;
            color: #fff;
            border: 2px solid #fff;
            font-family: 'retro', sans-serif;
            font-size: 12px;
            text-decoration: none;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
            transition: all 0.2s;
            margin-right: 10px;
        }
        
        .nav-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
            background: #2980b9;
            color: #fff;
            text-decoration: none;
        }
        
        .nav-btn i {
            margin-right: 5px;
        }
        
        /* 个人信息头部布局 */
        .profile-header {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
        }
        
        .profile-basic {
            flex: 1;
        }
        
        .profile-name {
            font-family: 'retro', sans-serif;
            font-size: 24px;
            color: #3498db;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0 #ccc;
        }
        
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .grid-section {
            margin-bottom: 20px;
        }
        
        .section-title {
            font-family: 'retro', sans-serif;
            font-size: 14px;
            color: #fff;
            background: #333;
            padding: 12px 15px;
            border: 2px solid #000;
            margin-bottom: 0;
            border-bottom: none;
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <header class="cped-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1><i class="fa fa-users"></i> CPED 官员生涯追踪系统</h1>
                    <div class="subtitle">Career Path Visualization System</div>
                </div>
                <div class="col-md-4 text-right">
                    <a href="../index.html" class="nav-btn">
                        <i class="fa fa-home"></i> 返回首页
                    </a>
                    <a href="CPEDindex.html" class="nav-btn" style="background: #27ae60;">
                        <i class="fa fa-upload"></i> 上传数据
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- 左侧搜索栏 -->
        <aside class="sidebar">
            <div class="panel-title">
                <i class="fa fa-search"></i> 搜索官员
            </div>
            <div class="search-box">
                <input type="text" class="pixel-input" id="search-input" placeholder="输入姓名搜索...">
                <button class="pixel-btn" onclick="searchOfficials()">
                    <i class="fa fa-search"></i> 搜索
                </button>
                <button class="pixel-btn secondary" onclick="clearSearch()">
                    <i class="fa fa-refresh"></i> 清空
                </button>
            </div>

            <div class="panel-title">
                <i class="fa fa-list"></i> 官员列表
            </div>
            <div class="officials-list" id="officials-list">
                <div class="loading-box">
                    <i class="fa fa-spinner fa-spin"></i> 加载中...
                </div>
            </div>
        </aside>

        <!-- 右侧主内容 -->
        <main class="content" id="main-content">
            <div class="empty-state">
                <h2><i class="fa fa-hand-pointer-o"></i> 选择一位官员</h2>
                <p>从左侧列表选择一位官员查看详细生涯数据</p>
                <p style="font-size: 14px; color: #999; margin-top: 20px;">
                    系统包含数千位官员的任职记录
                </p>
            </div>
        </main>
    </div>

    <script>
        // 全局数据
        let cpedData = {};
        let officialsList = [];
        let currentOfficial = null;
        let mapChart = null;

        // 级别配置 - 蓝色主题
        const levelConfig = {
            '小于副处': { order: 1, color: '#d6eaf8' },
            '副处': { order: 2, color: '#aed6f1' },
            '正处': { order: 3, color: '#85c1e9' },
            '副厅': { order: 4, color: '#5dade2' },
            '正厅': { order: 5, color: '#3498db' },
            '副部': { order: 6, color: '#2e86c1' },
            '正部': { order: 7, color: '#2874a6' },
            '副国': { order: 8, color: '#21618c' },
            '正国': { order: 9, color: '#1b4f72' }
        };

        // 初始化
        async function init() {
            try {
                // 优先使用 CPED_v1.5 的数据
                const response = await fetch('CPED_v1.5/data/cped_data.json');
                if (!response.ok) throw new Error('Data not found');
                cpedData = await response.json();
                officialsList = cpedData.officials || [];
                
                // 显示统计信息
                updateLoadingText(`已加载 ${officialsList.length.toLocaleString()} 位官员数据`);
                
                // 渲染列表（只显示前50个）
                setTimeout(() => {
                    renderOfficialsList(officialsList.slice(0, 50));
                }, 500);
            } catch (error) {
                console.error('数据加载失败:', error);
                document.getElementById('officials-list').innerHTML = `
                    <div class="loading-box" style="color: #e74c3c;">
                        <i class="fa fa-exclamation-triangle"></i> 数据加载失败
                    </div>
                `;
            }
        }

        // 更新加载提示
        function updateLoadingText(text) {
            document.getElementById('officials-list').innerHTML = `
                <div class="loading-box">
                    <i class="fa fa-spinner fa-spin"></i> ${text}
                </div>
            `;
        }

        // 渲染官员列表
        function renderOfficialsList(list) {
            const container = document.getElementById('officials-list');
            if (list.length === 0) {
                container.innerHTML = '<div class="loading-box">无搜索结果</div>';
                return;
            }

            container.innerHTML = list.map(o => `
                <div class="official-item" onclick="selectOfficial(${o.id})" data-id="${o.id}">
                    <div>
                        <div class="official-name">${o.name}</div>
                        <div class="official-info">${o.nativePlace?.province || ''} | ${o.education || ''}</div>
                    </div>
                </div>
            `).join('');
        }

        // 搜索官员
        function searchOfficials() {
            const keyword = document.getElementById('search-input').value.trim();
            if (!keyword) {
                renderOfficialsList(officialsList.slice(0, 50));
                return;
            }

            const filtered = officialsList.filter(o =>
                o.name.includes(keyword) ||
                (o.nativePlace?.province && o.nativePlace.province.includes(keyword))
            );
            renderOfficialsList(filtered.slice(0, 50));
        }

        // 清空搜索
        function clearSearch() {
            document.getElementById('search-input').value = '';
            renderOfficialsList(officialsList.slice(0, 50));
        }

        // 选择官员
        async function selectOfficial(id) {
            currentOfficial = officialsList.find(o => o.id === id);
            if (!currentOfficial) return;

            // 更新列表选中状态
            document.querySelectorAll('.official-item').forEach(item => {
                item.classList.toggle('active', parseInt(item.dataset.id) === id);
            });

            // 渲染详情
            renderOfficialDetail();
        }

        // 渲染官员详情
        function renderOfficialDetail() {
            const careers = cpedData.careers?.[currentOfficial.id] || [];
            const timelineData = cpedData.levelTimelines?.[currentOfficial.id] || [];
            const geoData = cpedData.geoMovements?.[currentOfficial.id] || [];

            const content = document.getElementById('main-content');
            content.innerHTML = `
                <!-- 基本信息 -->
                <div class="cped-card">
                    <div class="card-header-retro">
                        <i class="fa fa-user"></i> 基本信息
                    </div>
                    <div class="profile-header">
                        <div class="avatar">${currentOfficial.name[0]}</div>
                        <div class="profile-basic">
                            <div class="profile-name">${currentOfficial.name}</div>
                            <div class="profile-stats">
                                <div class="stat-box">
                                    <div class="stat-label">性别</div>
                                    <div class="stat-value">${currentOfficial.gender || '?'}</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-label">民族</div>
                                    <div class="stat-value">${currentOfficial.ethnicity || '?'}</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-label">学历</div>
                                    <div class="stat-value">${currentOfficial.education || '?'}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px;">
                        <div class="stat-box">
                            <div class="stat-label">籍贯</div>
                            <div class="stat-value" style="font-size: 16px;">${currentOfficial.nativePlace?.province || '-'} ${currentOfficial.nativePlace?.city || ''}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">出生日期</div>
                            <div class="stat-value" style="font-size: 16px;">${currentOfficial.birthDate || '-'}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">现状</div>
                            <div class="stat-value" style="font-size: 16px;">${currentOfficial.status || '-'}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">经历数</div>
                            <div class="stat-value" style="font-size: 16px;">${careers.length}</div>
                        </div>
                    </div>
                </div>

                <div class="dashboard-grid">
                    <!-- 级别变化马赛克图 -->
                    <div class="grid-section" style="grid-column: span 2;">
                        <div class="section-title">
                            <i class="fa fa-th"></i> 级别晋升马赛克图
                        </div>
                        <div id="level-grid-container">
                            ${generateLevelGrid(timelineData)}
                        </div>
                    </div>

                    <!-- 地理变迁地图 -->
                    <div class="grid-section" style="grid-column: span 2;">
                        <div class="section-title">
                            <i class="fa fa-map-marker"></i> 地理迁徙轨迹
                        </div>
                        <div class="map-container" id="geo-map"></div>
                    </div>
                </div>

                <!-- 详细履历 -->
                <div class="grid-section">
                    <div class="section-title">
                        <i class="fa fa-clock-o"></i> 详细履历 (${careers.length}条记录)
                    </div>
                    <div class="timeline">
                        ${careers.slice(0, 20).map(c => `
                            <div class="timeline-item">
                                <div class="timeline-date">${c.startDate || '未知'} ~ ${c.endDate || '至今'}</div>
                                <div class="timeline-position">${c.specificPosition || c.position1 || '-'}</div>
                                <div class="timeline-location">${c.province || ''} ${c.city || ''} ${c.county || ''}</div>
                                ${c.level ? `<span class="timeline-level-tag">${c.level}</span>` : ''}
                            </div>
                        `).join('')}
                        ${careers.length > 20 ? `
                            <div class="timeline-item" style="text-align: center; color: #666;">
                                还有 ${careers.length - 20} 条记录...
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            // 初始化地图（异步）
            setTimeout(() => {
                initGeoMap(geoData);
            }, 100);
        }

        // 生成马赛克级别图
        function generateLevelGrid(timelineData) {
            if (!timelineData || timelineData.length === 0) {
                return '<div style="padding: 40px; text-align: center; border: 2px solid #333; background: #fff; box-shadow: 3px 3px 0 #333;">无级别数据</div>';
            }

            // 级别顺序（从低到高）
            const levels = ['小于副处', '副处', '正处', '副厅', '正厅', '副部', '正部', '副国', '正国'];

            // 按年份分组，获取每年最高级别
            const yearMaxLevel = {};
            timelineData.forEach(item => {
                const year = item.date ? parseInt(item.date.substring(0, 4)) : null;
                if (year && year > 1950 && year < 2030) {
                    const levelOrder = levelConfig[item.level]?.order || 0;
                    if (!yearMaxLevel[year] || levelOrder > yearMaxLevel[year].order) {
                        yearMaxLevel[year] = { level: item.level, order: levelOrder };
                    }
                }
            });

            // 获取年份范围
            const years = Object.keys(yearMaxLevel).map(Number).sort((a, b) => a - b);
            if (years.length === 0) {
                return '<div style="padding: 40px; text-align: center; border: 2px solid #333; background: #fff; box-shadow: 3px 3px 0 #333;">无有效级别数据</div>';
            }

            const minYear = years[0];
            const maxYear = years[years.length - 1];
            
            // 限制显示年份范围，避免过宽
            const displayStartYear = Math.max(minYear, maxYear - 30);

            // 构建完整的年度最高级别记录（填充缺失年份）
            let currentMaxOrder = 0;
            const yearLevels = {};
            for (let y = displayStartYear; y <= maxYear; y++) {
                if (yearMaxLevel[y]) {
                    currentMaxOrder = Math.max(currentMaxOrder, yearMaxLevel[y].order);
                }
                yearLevels[y] = currentMaxOrder;
            }

            // 生成网格 HTML
            let html = '<div class="mosaic-grid" style="margin: 0;">\n';

            // 空白角落单元格
            html += '<div class="mosaic-label">级别\\年份</div>\n';

            // 年份标题行
            for (let y = displayStartYear; y <= maxYear; y++) {
                html += `<div class="mosaic-header">${y.toString().substr(2)}</div>\n`;
            }

            // 为每个级别生成一行
            levels.forEach((levelName, index) => {
                const levelOrder = index + 1;

                // 级别标签
                html += `<div class="mosaic-label">${levelName}</div>\n`;

                // 每年的单元格
                for (let y = displayStartYear; y <= maxYear; y++) {
                    const yearTopOrder = yearLevels[y];
                    const isFilled = yearTopOrder >= levelOrder;
                    const levelColor = levelConfig[levelName]?.color || '#3498db';
                    
                    html += `<div class="mosaic-cell ${isFilled ? 'filled' : 'empty'}" 
                        style="${isFilled ? 'background: ' + levelColor + ';' : ''}"
                        title="${y}年 ${levelName}${isFilled ? ' (已达成)' : ''}"></div>\n`;
                }
            });

            html += '</div>';

            // 添加说明
            html += `
                <div style="margin-top: 15px; padding: 15px; background: #fff; border: 2px solid #333; box-shadow: 3px 3px 0 #333;">
                    <p style="font-size: 14px; margin-bottom: 8px;">
                        <strong><i class="fa fa-info-circle"></i> 图表说明：</strong>横轴为年份，纵轴为级别。蓝色方块表示该年份已达到或超过该级别。
                    </p>
                    <p style="font-size: 12px; color: #666;">
                        示例：如果某官员在2010年成为"正厅级"，则2010年及以后所有"小于副处"到"正厅"级别的格子都会显示为蓝色。
                    </p>
                </div>
            `;

            return html;
        }

        // 加载中国地图
        async function loadChinaMap() {
            try {
                // 优先从 CPED_v1.5 加载
                const response = await fetch('CPED_v1.5/china.json');
                if (!response.ok) throw new Error('Map not found in CPED_v1.5');
                const chinaJson = await response.json();
                echarts.registerMap('china', chinaJson);
                return true;
            } catch (error) {
                console.error('地图加载失败:', error);
                return false;
            }
        }

        // 初始化地理迁徙地图
        async function initGeoMap(geoData) {
            const mapContainer = document.getElementById('geo-map');
            if (!mapContainer) return;
            
            if (!geoData || geoData.length === 0) {
                mapContainer.innerHTML = '<div class="loading-box">无地理数据</div>';
                return;
            }

            // 确保地图已注册
            const mapLoaded = await loadChinaMap();
            if (!mapLoaded) {
                mapContainer.innerHTML = '<div class="loading-box" style="padding-top: 200px;">地图数据加载失败<br><small>请检查网络连接</small></div>';
                return;
            }

            // 省份坐标映射（简化版）
            const provinceCoords = {
                '北京市': [116.4, 39.9], '上海市': [121.4, 31.2], '天津市': [117.2, 39.1], '重庆市': [106.5, 29.6],
                '河北省': [114.5, 38.0], '山西省': [112.5, 37.9], '辽宁省': [123.4, 41.8], '吉林省': [125.3, 43.9],
                '黑龙江省': [126.6, 45.8], '江苏省': [118.8, 32.1], '浙江省': [120.2, 30.3], '安徽省': [117.3, 31.9],
                '福建省': [119.3, 26.1], '江西省': [115.9, 28.7], '山东省': [117.0, 36.7], '河南省': [113.6, 34.8],
                '湖北省': [114.3, 30.6], '湖南省': [113.0, 28.2], '广东省': [113.3, 23.1], '海南省': [110.3, 20.0],
                '四川省': [104.1, 30.7], '贵州省': [106.7, 26.6], '云南省': [102.7, 25.0], '陕西省': [108.9, 34.3],
                '甘肃省': [103.8, 36.1], '青海省': [101.8, 36.6], '台湾省': [121.5, 25.0], '内蒙古自治区': [111.7, 40.8],
                '广西壮族自治区': [108.3, 22.8], '西藏自治区': [91.1, 29.7], '宁夏回族自治区': [106.3, 38.5],
                '新疆维吾尔自治区': [87.6, 43.8], '香港特别行政区': [114.2, 22.3], '澳门特别行政区': [113.5, 22.2],
                '中央': [116.4, 39.9]
            };

            // 构建迁徙数据
            const moveData = [];
            const points = [];
            const processedProvinces = new Set();

            for (let i = 0; i < geoData.length - 1; i++) {
                const from = geoData[i];
                const to = geoData[i + 1];

                const fromCoord = provinceCoords[from.province];
                const toCoord = provinceCoords[to.province];

                if (fromCoord && toCoord && from.province !== to.province) {
                    moveData.push({
                        fromName: from.province,
                        toName: to.province,
                        coords: [fromCoord, toCoord],
                        value: i + 1
                    });
                }

                if (fromCoord && !processedProvinces.has(from.province)) {
                    processedProvinces.add(from.province);
                    points.push({
                        name: from.province,
                        value: [...fromCoord, i + 1],
                        itemStyle: { color: '#3498db' }
                    });
                }
            }

            // 最后一个点
            const last = geoData[geoData.length - 1];
            const lastCoord = provinceCoords[last.province];
            if (lastCoord && !processedProvinces.has(last.province)) {
                points.push({
                    name: last.province,
                    value: [...lastCoord, geoData.length],
                    itemStyle: { color: '#2980b9' }
                });
            }

            // 销毁旧图表
            if (mapChart) {
                mapChart.dispose();
            }

            mapChart = echarts.init(mapContainer);

            mapChart.setOption({
                backgroundColor: '#f5f5f5',
                title: {
                    text: `${currentOfficial.name} - 工作地迁徙轨迹`,
                    left: 'center',
                    top: 10,
                    textStyle: {
                        fontFamily: 'retro1',
                        fontSize: 16,
                        color: '#333'
                    }
                },
                tooltip: {
                    trigger: 'item',
                    formatter: function(params) {
                        if (params.seriesType === 'lines') {
                            return `${params.data.fromName} → ${params.data.toName}`;
                        }
                        return params.name;
                    }
                },
                geo: {
                    map: 'china',
                    roam: true,
                    zoom: 1.2,
                    label: {
                        show: true,
                        fontSize: 10,
                        color: '#333'
                    },
                    itemStyle: {
                        areaColor: '#fff',
                        borderColor: '#333',
                        borderWidth: 1
                    },
                    emphasis: {
                        itemStyle: {
                            areaColor: '#d6eaf8'
                        }
                    }
                },
                series: [
                    {
                        name: '迁徙',
                        type: 'lines',
                        zlevel: 1,
                        effect: {
                            show: true,
                            period: 6,
                            trailLength: 0.7,
                            color: '#3498db',
                            symbolSize: 3
                        },
                        lineStyle: {
                            color: '#3498db',
                            width: 2,
                            curveness: 0.2
                        },
                        data: moveData
                    },
                    {
                        name: '工作地点',
                        type: 'effectScatter',
                        coordinateSystem: 'geo',
                        zlevel: 2,
                        rippleEffect: {
                            brushType: 'stroke',
                            scale: 3
                        },
                        label: {
                            show: true,
                            position: 'right',
                            formatter: '{b}',
                            fontSize: 12
                        },
                        symbolSize: function (val) {
                            return 8 + Math.min(val[2] * 1.5, 15);
                        },
                        itemStyle: {
                            color: '#3498db'
                        },
                        data: points
                    }
                ]
            });

            window.addEventListener('resize', () => mapChart && mapChart.resize());
        }

        // 搜索框回车事件
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        searchOfficials();
                    }
                });
            }
            
            // 启动应用
            init();
        });
    </script>
</body>
</html>
