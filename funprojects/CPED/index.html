<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPED 官员生涯追踪系统</title>
  <meta name="description" content="Interactive visualization of Chinese political elite career trajectories based on CPED data">

  <!-- 第三方库 -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- 样式 -->
  <link rel="stylesheet" href="../../libs/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="app-container">
    <!-- 头部 -->
    <header class="app-header">
      <div class="header-content">
        <h1 class="app-title">
          <i class="fa fa-users"></i>
          CPED 官员生涯追踪系统
        </h1>
        <a href="cities.html" class="btn btn-primary">
          <i class="fa fa-building"></i> 城市领导
        </a>
        <a href="../../index.html" class="btn btn-primary">
          <i class="fa fa-home"></i> 返回首页
        </a>
      </div>
    </header>

    <!-- 主布局 -->
    <div class="main-layout">
      <!-- 侧边栏 -->
      <aside class="sidebar">
        <div id="officials-list">
          <div class="loading-state">
            <i class="fa fa-spinner fa-spin"></i>
            <p>正在加载...</p>
          </div>
        </div>
      </aside>

      <!-- 主内容区 -->
      <main class="main-content" id="main-content">
        <div class="empty-state welcome">
          <i class="fa fa-hand-pointer-o"></i>
          <h2>请选择一位官员</h2>
          <p>从左侧列表选择官员查看详细生涯数据</p>
        </div>
      </main>
    </div>
  </div>

  <!-- 应用脚本 -->
  <script type="module">
    import { app } from './js/app.js';

    // 启动应用
    app.init();

    // 处理浏览器返回
    window.addEventListener('popstate', (e) => {
      app.handlePopState(e);
    });
  </script>
</body>
</html>
