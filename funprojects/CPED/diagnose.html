<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>诊断 - CPED</title>
  <style>
    body { font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; }
    .log { margin: 5px 0; padding: 8px; border-left: 3px solid #ccc; }
    .info { border-color: blue; }
    .success { border-color: green; background: #f0fff0; }
    .error { border-color: red; background: #fff0f0; }
    .warn { border-color: orange; background: #fff8f0; }
    button { padding: 10px 20px; font-size: 14px; cursor: pointer; margin: 5px; }
    #logs { margin-top: 20px; }
    .step { font-weight: bold; margin-top: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }
  </style>
</head>
<body>
  <h1>CPED 诊断工具</h1>
  <button onclick="startDiagnose()">开始诊断</button>
  <button onclick="clearLogs()">清除日志</button>
  <div id="logs"></div>

  <script type="module">
    const logs = document.getElementById('logs');

    function log(msg, type = 'info') {
      const div = document.createElement('div');
      div.className = `log ${type}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logs.appendChild(div);
    }

    window.clearLogs = () => { logs.innerHTML = ''; };

    function step(name) {
      const div = document.createElement('div');
      div.className = 'step';
      div.textContent = `▶ ${name}`;
      logs.appendChild(div);
    }

    window.startDiagnose = async function() {
      clearLogs();

      // Step 1: 基础信息
      step('基础信息');
      log(`URL: ${window.location.href}`);
      log(`User Agent: ${navigator.userAgent.slice(0, 50)}...`);

      // Step 2: 测试路径模块
      step('路径模块测试');
      try {
        const pathModule = await import('./js/utils/path.js');
        log('✓ path.js 导入成功', 'success');

        const indexUrl = pathModule.getIndexUrl();
        log(`Index URL: ${indexUrl}`);

        // 直接测试 fetch
        log('开始 fetch 测试...');
        const startTime = Date.now();
        try {
          const resp = await fetch(indexUrl);
          const elapsed = Date.now() - startTime;
          if (resp.ok) {
            const data = await resp.json();
            log(`✓ fetch 成功: ${data.officials?.length || 0} 官员 (${elapsed}ms)`, 'success');
          } else {
            log(`✗ fetch 失败: HTTP ${resp.status}`, 'error');
          }
        } catch (e) {
          log(`✗ fetch 异常: ${e.message}`, 'error');
        }
      } catch (e) {
        log(`✗ path.js 导入失败: ${e.message}`, 'error');
      }

      // Step 3: 测试 DataLoader
      step('DataLoader 测试');
      try {
        const { dataLoader } = await import('./js/services/dataLoader.js');
        log('✓ dataLoader 导入成功', 'success');

        log('调用 getOfficialsList()...');
        const startTime = Date.now();

        try {
          const officials = await dataLoader.getOfficialsList();
          const elapsed = Date.now() - startTime;
          log(`✓ 加载成功: ${officials.length} 官员 (${elapsed}ms)`, 'success');

          if (officials.length > 0) {
            log(`示例: ${officials[0].name}`);
          }
        } catch (e) {
          log(`✗ 加载失败: ${e.message}`, 'error');
          log(`堆栈: ${e.stack?.slice(0, 200)}`, 'error');
        }
      } catch (e) {
        log(`✗ dataLoader 导入失败: ${e.message}`, 'error');
      }

      // Step 4: 测试 Sidebar
      step('Sidebar 组件测试');
      try {
        const { Sidebar } = await import('./js/components/Sidebar.js');
        log('✓ Sidebar 导入成功', 'success');

        // 创建一个测试容器
        let testContainer = document.getElementById('test-sidebar');
        if (!testContainer) {
          testContainer = document.createElement('div');
          testContainer.id = 'test-sidebar';
          document.body.appendChild(testContainer);
        }
        testContainer.innerHTML = '<div id="sidebar-test-container" style="border: 2px dashed #ccc; padding: 10px; margin: 10px 0;">测试容器</div>';

        const sidebar = new Sidebar('sidebar-test-container');
        log('Sidebar 实例创建成功');

        log('调用 sidebar.init()...');
        await sidebar.init();
        log('✓ sidebar.init() 完成', 'success');
      } catch (e) {
        log(`✗ Sidebar 测试失败: ${e.message}`, 'error');
        log(`堆栈: ${e.stack?.slice(0, 200)}`, 'error');
      }

      step('诊断完成');
    };
  </script>
</body>
</html>
