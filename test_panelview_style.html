<!DOCTYPE html>
<html>
<head>
    <title>测试PanelView样式</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/effects.css">
    <link rel="stylesheet" href="../assets/css/retro.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="libs/font-awesome/css/font-awesome.min.css">
    <style>
        body {
            font-family: 'retro1', sans-serif;
            cursor: URL("../assets/img/cursor/cursor.png"), auto !important;
            background: #f5f5f5;
        }
        
        .project {
            margin-bottom: 20px;
            border-radius: 0;
            border: 2px solid #333;
            box-shadow: 4px 4px 0px #333;
            background: #fff;
            padding: 20px;
        }
        
        .btn {
            border-radius: 0;
            border: 2px solid #333;
            font-family: 'retro1', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 2px 2px 0px #333;
            transition: all 0.2s;
            background: #3498db;
            color: #fff;
            padding: 12px 24px;
        }
        
        .btn:hover {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #333;
        }
        
        label {
            font-family: 'retro', sans-serif;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- Navigation Header -->
    <nav style="background: #333; padding: 15px 0; border-bottom: 3px solid #fff;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="color: #fff; margin: 0; font-family: 'retro', sans-serif;">
                    <i class="fa fa-chart-bar"></i> PanelView 数据可视化系统
                </h2>
                <div>
                    <a href="../index.html" class="btn btn-primary" style="margin-right: 10px;">
                        <i class="fa fa-home"></i> 返回首页
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 30px;">
        <h1 style="text-align: center; font-family: 'retro', sans-serif; color: #333; margin-bottom: 30px;">
            <i class="fa fa-chart-line"></i> PanelView Web 版本
        </h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="project">
                    <label><i class="fa fa-cog"></i> 绘图选项</label>
                    <select class="form-control" style="border: 2px solid #333; border-radius: 0;">
                        <option>Missing Pattern 缺失模式</option>
                        <option>Treatment Effect 处理效应</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="project">
                    <label><i class="fa fa-upload"></i> 上传数据文件</label>
                    <input type="file" class="form-control" style="border: 2px solid #333; border-radius: 0;">
                </div>
            </div>
        </div>
        
        <div class="project">
            <label><i class="fa fa-database"></i> 可用变量</label>
            <div style="border: 2px solid #333; padding: 20px; background: #f9f9f9; min-height: 100px;">
                <span style="color: #3498db; background: #3498db; color: white; padding: 8px 15px; margin: 5px; display: inline-block; border: 2px solid #333; font-weight: bold;">变量1</span>
                <span style="color: #3498db; background: #3498db; color: white; padding: 8px 15px; margin: 5px; display: inline-block; border: 2px solid #333; font-weight: bold;">变量2</span>
                <span style="color: #3498db; background: #3498db; color: white; padding: 8px 15px; margin: 5px; display: inline-block; border: 2px solid #333; font-weight: bold;">变量3</span>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="project">
                    <label style="color: #e74c3c;"><i class="fa fa-bullseye"></i> 因变量</label>
                    <div style="border: 2px solid #333; padding: 20px; background: #f9f9f9; min-height: 80px;">
                        <span style="background: #e74c3c; color: white; padding: 8px 15px; margin: 5px; display: inline-block; border: 2px solid #333; font-weight: bold;">结果变量</span>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="project">
                    <label style="color: #3498db;"><i class="fa fa-arrows"></i> 自变量</label>
                    <div style="border: 2px solid #333; padding: 20px; background: #f9f9f9; min-height: 80px;">
                        <span style="background: #3498db; color: white; padding: 8px 15px; margin: 5px; display: inline-block; border: 2px solid #333; font-weight: bold;">解释变量1</span>
                        <span style="background: #3498db; color: white; padding: 8px 15px; margin: 5px; display: inline-block; border: 2px solid #333; font-weight: bold;">解释变量2</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center" style="margin: 30px 0;">
            <button class="btn" style="font-size: 18px; padding: 15px 30px;">
                <i class="fa fa-play"></i> 开始绘图
            </button>
            <button class="btn" style="font-size: 18px; padding: 15px 30px; background: #e74c3c; margin-left: 15px;">
                <i class="fa fa-trash"></i> 清空所有
            </button>
        </div>
        
        <div class="project">
            <label><i class="fa fa-chart-area"></i> 可视化结果</label>
            <div style="border: 2px solid #333; padding: 40px; background: #fff; min-height: 300px; text-align: center;">
                <i class="fa fa-info-circle" style="font-size: 48px; color: #666; margin-bottom: 20px;"></i>
                <p style="font-size: 18px; color: #666;">
                    请上传数据文件并配置变量，然后点击"开始绘图"按钮
                </p>
                <p style="color: #999; font-size: 14px;">
                    PanelView 支持缺失数据模式分析和因果推断可视化
                </p>
            </div>
        </div>
    </div>
</body>
</html>
